<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字烟花 - 完整更新版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: none;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <canvas id="fireworkCanvas" width="400" height="600"></canvas>

    <script>
        // 核心配置（和Python版完全一致）
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 600;
        const STAR_COUNT = 100;
        const FONT_SIZE = 30;
        const FONT_HEIGHT = 40;
        const FIREWORK_SPEED = 0.5;
        const PARTICLE_COUNT = 15;

        // 获取画布上下文
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // 颜色列表（复刻Python原版）
        const colorList = [
            [255,215,0], [255,140,0], [0,255,255], [127,255,212], [127,255,0],
            [0,250,154], [255,0,0], [255,69,0], [0,110,154], [255,128,128],
            [188,0,255], [255,0,239], [0,255,51]
        ];

        // ====================== 星星系统（完整更新逻辑）======================
        let stars = [];
        // 初始化星星（和Python版一致）
        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * CANVAS_HEIGHT,
                    size: Math.random() * 2 + 2,
                    brightness: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.01 + 0.01,
                    direction: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        // 星星更新（完整亮度和绘制逻辑）
        function updateStars() {
            for (let star of stars) {
                // 亮度更新逻辑（和Python版完全一致）
                star.brightness += star.speed * star.direction;
                if (star.brightness <= 0.2) {
                    star.brightness = 0.2;
                    star.direction = 1;
                } else if (star.brightness >= 1.0) {
                    star.brightness = 1.0;
                    star.direction = -1;
                }
                // 绘制星星
                const c = Math.floor(255 * star.brightness);
                ctx.fillStyle = `rgb(${c}, ${c}, ${c})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ====================== 粒子系统（完整更新逻辑）======================
        class Particle {
            constructor(x, y, vx, vy, life, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.color = color;
            }

            // 粒子更新（复刻Python物理逻辑）
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.5; // 重力加速度
                this.life--;

                // 绘制粒子
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ====================== 烟花系统（完整更新逻辑）======================
        class Firework {
            constructor(targetX, targetY) {
                this.x = targetX;                  // 点击X坐标
                this.targetY = targetY;           // 爆炸Y坐标
                this.speed = FIREWORK_SPEED;      // 上升速度
                this.color = colorList[Math.floor(Math.random() * colorList.length)];
                this.drops = [CANVAS_HEIGHT / FONT_HEIGHT]; // 初始位置（和Python一致）
                this.exploded = false;            // 爆炸状态
            }

            // 烟花完整更新逻辑
            update() {
                if (this.exploded) return;

                // 数字拖尾更新（复刻Python循环逻辑）
                for (let i = 0; i < this.drops.length; i++) {
                    // 随机数字
                    const text = Math.floor(Math.random() * 10).toString();
                    // 字体设置
                    ctx.font = `${FONT_SIZE}px "Microsoft YaHei", "SimHei", Arial`;
                    ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                    // 位置计算（数字居中）
                    const xPos = this.x - 15;
                    const yPos = this.drops[i] * FONT_HEIGHT;
                    // 绘制数字
                    ctx.fillText(text, xPos, yPos);
                    // 匀速上升（核心更新逻辑）
                    this.drops[i] -= this.speed;

                    // 爆炸触发逻辑（和Python版一致）
                    if (this.drops[i] * FONT_HEIGHT <= this.targetY && !this.exploded) {
                        this.exploded = true;
                        // 生成粒子
                        this.createParticles(xPos + 10, yPos);
                    }
                }
            }

            // 生成粒子（完整逻辑）
            createParticles(x, y) {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const vx = Math.floor(Math.random() * 17) - 8;  // -8 ~ 8
                    const vy = Math.floor(Math.random() * 11) - 15; // -15 ~ -5
                    const life = Math.floor(Math.random() * 21) + 10; // 10 ~ 30
                    particles.push(new Particle(x, y, vx, vy, life, this.color));
                }
            }
        }

        // ====================== 全局变量 & 交互 ======================
        let fireworks = [];    // 活跃烟花列表
        let particles = [];    // 活跃粒子列表

        // 点击触发烟花（完整坐标计算）
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            // 适配不同屏幕的坐标转换
            const clickX = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const clickY = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);
            fireworks.push(new Firework(clickX, clickY));
        });

        // ====================== 主循环（完整更新逻辑）======================
        function mainLoop() {
            requestAnimationFrame(mainLoop);

            // 半透明遮罩（保留拖尾，和Python版一致）
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 更新并绘制星星（底层）
            updateStars();

            // 2. 更新烟花（中层）
            const activeFireworks = [];
            for (let fw of fireworks) {
                fw.update();
                if (!fw.exploded) {
                    activeFireworks.push(fw);
                }
            }
            fireworks = activeFireworks; // 清理已爆炸的烟花

            // 3. 更新粒子（顶层）
            const activeParticles = [];
            for (let p of particles) {
                p.update();
                if (p.life > 0) {
                    activeParticles.push(p);
                }
            }
            particles = activeParticles; // 清理死亡粒子
        }

        // 初始化并启动
        initStars();
        mainLoop();

        // 窗口适配（保证手机/电脑都正常）
        window.addEventListener('resize', () => {
            const scale = Math.min(
                window.innerWidth / CANVAS_WIDTH,
                window.innerHeight / CANVAS_HEIGHT
            );
            canvas.style.transform = `scale(${scale})`;
        });
    </script>
</body>
</html>
